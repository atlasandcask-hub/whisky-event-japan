name: WEJ Instagram Approval Dry Run
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Exact WEJ post ID to validate (no publishing)"
        required: true
        type: string
  pull_request:
    paths:
      - "posting/**"
      - "scripts/approval_gate.py"
      - "scripts/validate_post_queue.py"
      - ".github/workflows/instagram-approval-dry-run.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate queue schema
        run: python scripts/validate_post_queue.py
      - name: Run approval gate unit tests
        run: python -m unittest discover -s scripts -p "test_approval_gate.py" -v
      - name: Approval gate (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          WEJ_POST_ID: ${{ inputs.post_id }}
        run: python scripts/approval_gate.py --post-id "$WEJ_POST_ID"
      - name: Explain dry run
        run: echo "No Meta credentials, publishing endpoint, or Instagram upload is used."
