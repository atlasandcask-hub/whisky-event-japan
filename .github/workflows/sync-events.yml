name: Sync WEJ Events

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backup existing events
        run: cp events.json events.json.backup

      - name: Sync events from public CSV
        run: python scripts/sync_events.py

      - name: Validate events JSON
        run: |
          python -m json.tool events.json > /dev/null

      - name: Commit updated events
        run: |
          git add events.json
          if ! git diff --cached --quiet; then
            git -c user.name="WEJ Sync Bot" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Update WEJ events"
            git push
          fi
